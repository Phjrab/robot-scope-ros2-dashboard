name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  competition-offline-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hardware-free competition dependencies
        run: python -m pip install -r requirements.txt -r requirements-competition-offline.txt
      - name: Require optional libraries (no silent dependency skips)
        run: python -c "import cv2, scipy, numpy, jsonschema; print(cv2.__version__, scipy.__version__, numpy.__version__)"
      - name: Fetch exact historical dependencies for C2 comparative tests
        # Historical review commits are not necessarily ancestors of a copied main.
        run: git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/Phjrab/robot-scope-ros2-dashboard.git 765622ecbe20dd29b40296dd2ad24fa508ac9443 380800ca9e211495769fe60ee8221e3f4fb40f16 9e9ebcc0cbc613d5b0a7f50a27a7b256c3f829bd
      - name: Run C2, C4 and actual package integration
        env:
          C2_CROSS_REQUIRED: "1"
        run: |
          PYTHONPATH=tests python -m unittest discover -s tests/competition_native -t tests -v
          PYTHONPATH=tests python -m unittest discover -s tests/competition_traffic -t tests -v
          PYTHONPATH=tests python -m unittest discover -s tests/competition_integration -t tests -v
          python -m unittest discover -s tests -p test_competition_evidence_revision.py -v
      - name: Run D0 subtrees in separate interpreters
        run: |
          python -m unittest discover -s experiments/competition_vm/traffic_signals/tests -v
          python -m unittest discover -s experiments/competition_vm/avoidance/tests -v
          python -m unittest discover -s experiments/competition_vm/integration/tests -v
          python -m unittest discover -s experiments/competition_vm/arena_robot_sim/revisions/d0_20261024 -p test_regression.py -v
          python -m unittest discover -s experiments/competition_vm/integration/revisions/d0_20261024/independent_review -v
      - name: Run C3 offline tests (not native matrix)
        run: |
          git -c http.https://github.com/.extraheader= fetch --no-tags --depth=1 https://github.com/Phjrab/robot-scope-ros2-dashboard.git 83f4ee8d6971d00ab31b2de0eeebf329542dd5d6
          python experiments/competition_nav2/prepare_d0.py
          python -m unittest discover -s experiments/competition_nav2/tests -v

  hardware-free-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact historical dependencies for C2 comparative tests
        run: git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/Phjrab/robot-scope-ros2-dashboard.git 765622ecbe20dd29b40296dd2ad24fa508ac9443 380800ca9e211495769fe60ee8221e3f4fb40f16 9e9ebcc0cbc613d5b0a7f50a27a7b256c3f829bd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-competition-offline.txt
          python -m pip install -r requirements-quality.txt

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Audit JavaScript dependency resolution
        run: npm audit --audit-level=high

      - name: Run Python static checks
        run: |
          python -m ruff check robot_dashboard scripts
          python -m mypy --config-file mypy.ini

      - name: Scan tracked source for credentials
        run: python scripts/check_repository_secrets.py

      - name: Audit Python dependency resolution
        run: |
          python -m pip check
          python -m pip_audit -r requirements.txt

      - name: Run Python tests with coverage
        env:
          C2_CROSS_REQUIRED: "1"
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --show-missing

      - name: Run JavaScript tests
        run: node --test tests/*.mjs

      - name: Check JavaScript syntax
        run: node scripts/check_frontend_syntax.mjs

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run mission real-API fixture E2E
        run: npx playwright test --config playwright.competition.config.mjs --reporter=line --output=competition-test-results

      - name: Run manual 2D real-API fixture E2E
        env:
          MANUAL_NAVIGATION_TEST_PYTHON: python
        run: npx playwright test --config playwright.manual-navigation.config.mjs --reporter=line --output=manual-navigation-test-results

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            test-results/
            competition-test-results/
            manual-navigation-test-results/
          if-no-files-found: ignore

  # Keep the complete browser suite within the existing job budget on private
  # runners. Test-level sharding balances large files; each shard still uses
  # the configured single worker and unchanged assertions.
  hardware-free-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
            shard: 1
          - os: ubuntu-22.04
            python: "3.10"
            shard: 2
          - os: ubuntu-24.04
            python: "3.12"
            shard: 1
          - os: ubuntu-24.04
            python: "3.12"
            shard: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact historical dependencies for Python fixtures
        run: git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/Phjrab/robot-scope-ros2-dashboard.git 765622ecbe20dd29b40296dd2ad24fa508ac9443 380800ca9e211495769fe60ee8221e3f4fb40f16 9e9ebcc0cbc613d5b0a7f50a27a7b256c3f829bd
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install fixture dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-competition-offline.txt
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run hardware-free browser E2E shard
        run: npm run test:e2e:ci -- --fully-parallel --shard=${{ matrix.shard }}/2
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.os }}-python-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
