name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware-free-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-quality.txt

      - name: Run Python static checks
        run: |
          python -m ruff check robot_dashboard scripts
          python -m mypy --config-file mypy.ini

      - name: Scan tracked source for credentials
        run: python scripts/check_repository_secrets.py

      - name: Audit Python dependency resolution
        run: |
          python -m pip check
          python -m pip_audit -r requirements.txt

      - name: Run Python tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --show-missing

      - name: Run JavaScript tests
        run: node --test tests/*.mjs

      - name: Check JavaScript syntax
        run: node scripts/check_frontend_syntax.mjs
