name: C3 native Humble review

on:
  push:
    branches: [review/20261024-c3-nav2-benchmark]
    paths:
      - experiments/competition_nav2/**
      - .github/workflows/competition-nav2-review.yml

permissions:
  contents: read

concurrency:
  group: c3-native-humble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and runner
        run: |
          mkdir -p "$RUNNER_TEMP/c3-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/c3-evidence/source-sha.txt"
          docker version > "$RUNNER_TEMP/c3-evidence/docker-version.txt"
          uname -a > "$RUNNER_TEMP/c3-evidence/runner.txt"
      - name: Build Humble image (download phase)
        timeout-minutes: 12
        run: |
          cp experiments/competition_nav2/repro/image-lock.json "$RUNNER_TEMP/c3-evidence/image-lock.json"
          python3 experiments/competition_nav2/container/manage.py build --lock "$RUNNER_TEMP/c3-evidence/image-lock.json"
      - name: Materialize exact upstream and original D0 inputs (download phase)
        run: |
          git clone --depth 1 --branch 1.1.20 https://github.com/ros-navigation/navigation2.git "$RUNNER_TEMP/c3-nav2-upstream"
          test "$(git -C "$RUNNER_TEMP/c3-nav2-upstream" rev-parse HEAD)" = a097086719c88f781aa59788eca29ac6ca5e56db
          git fetch --no-tags --depth=1 origin 83f4ee8d6971d00ab31b2de0eeebf329542dd5d6
          python3 experiments/competition_nav2/prepare_d0.py
      - name: ROUND7 - same checker with bounded atomic planner diagnostic
        timeout-minutes: 20
        run: |
          python3 experiments/competition_nav2/overlay/build.py --diagnostic --source "$RUNNER_TEMP/c3-nav2-upstream" --lock "$RUNNER_TEMP/c3-evidence/image-lock.json" --output "$RUNNER_TEMP/c3-evidence/overlay"
      - name: ROUND7 - exactly one feasible1 closed-loop diagnostic
        timeout-minutes: 10
        run: |
          python3 experiments/competition_nav2/overlay/run_atomic.py --lock "$RUNNER_TEMP/c3-evidence/overlay/overlay-lock.json" --output "$RUNNER_TEMP/c3-evidence/atomic"
      - name: Preserve native evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c3-evidence/
            !${{ runner.temp }}/c3-evidence/**/*.pgm
          if-no-files-found: error
          retention-days: 14
