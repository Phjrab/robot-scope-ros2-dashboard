name: C3 native Humble review

on:
  push:
    branches: [review/20261024-c3-nav2-benchmark]
    paths:
      - experiments/competition_nav2/**
      - .github/workflows/competition-nav2-review.yml

permissions:
  contents: read

concurrency:
  group: c3-native-humble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and runner
        run: |
          mkdir -p "$RUNNER_TEMP/c3-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/c3-evidence/source-sha.txt"
          docker version > "$RUNNER_TEMP/c3-evidence/docker-version.txt"
          uname -a > "$RUNNER_TEMP/c3-evidence/runner.txt"
      - name: Materialize pinned D0 inputs and original sensor source (read only)
        run: |
          git fetch --no-tags --depth=1 origin 83f4ee8d6971d00ab31b2de0eeebf329542dd5d6
          python3 experiments/competition_nav2/prepare_d0.py
      - name: Build Humble image (download phase)
        timeout-minutes: 12
        run: |
          cp experiments/competition_nav2/repro/image-lock.json "$RUNNER_TEMP/c3-evidence/image-lock.json"
          python3 experiments/competition_nav2/container/manage.py build --lock "$RUNNER_TEMP/c3-evidence/image-lock.json"
      - name: Single B1 coverage correction (conditional maximum six cases)
        timeout-minutes: 20
        run: |
          python3 experiments/competition_nav2/run_narrow.py --variant omni_coverage --lock "$RUNNER_TEMP/c3-evidence/image-lock.json" --output "$RUNNER_TEMP/c3-evidence/narrow"
      - name: Preserve native evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c3-evidence/
            !${{ runner.temp }}/c3-evidence/**/*.pgm
          if-no-files-found: error
          retention-days: 14
